# Drop-in for /etc/mosquitto/conf.d/ on the edge box (Ubuntu's mosquitto package already includes
# that directory from the base /etc/mosquitto/mosquitto.conf, which keeps its own persistence/log
# settings — this file only adds the listener).
#
# Unlike infra/docker/mosquitto/mosquitto.conf (local dev, where the broker needs to accept
# connections from other containers), this broker only ever talks to processes running on the
# same machine — the edge agent and whatever driver processes publish telemetry locally — so it's
# bound to loopback and never reachable from the site's network at all.
listener 1883 127.0.0.1
allow_anonymous true
